# ===========================================================================
# TOKEN POLICY (dsh-token-saver) - host-plane rows for non-preset profiles.
# These bundles mount the tools directly on the host plane, so a plain
# `- id:` row applies (unlike the `web` profile, where they live in the
# `preset-standard` preset). See https://github.com/vit-cerny/dsh-token-saver
# ===========================================================================

# Spawning tools removed: an agent cannot start unrequested subagents or
# workflows. Prompt text is advice; an absent tool is enforcement.
- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: tool-workflow
  disabled: true

# Backstop caps for profiles that enable delegation explicitly.
- id: subagent
  config:
    maxDepth: 1
    maxActiveSubagents: 1

- id: spill-policy
  config:
    maxInlineTokens: 6000

- id: repeat-tool-reminder
  config:
    thresholds: [3, 8]
    argumentsPreviewChars: 200

- id: session-title-llm
  config:
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 2048
    maxOutputTokens: 1024
    timeoutMs: 30000

- id: harness-dev-context
  disabled: true
# Native Agent Teams (dsh-experimental-agent-team-profile). Disabling the
# subagent tools alone is NOT enough: this bundle mounts its own team tool and
# service on the host plane, and a team member is a full agent stream.
- id: tool-agent-team
  disabled: true

- id: agent-team
  disabled: true
# `workflow-ptc` carries provider: spawn and can start workflows that fan out
# into agents. The control/list tools are the rest of the delegation surface.
- id: workflow-ptc
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true
